spring:
  application:
    name: easybeach-backend
  jackson:
    default-property-inclusion: non_null
  jpa:
    # OSIV se mantiene ON a propósito: el filtro de tenant (ver
    # shared.tenancy.TenantFilterService) depende de que el mismo
    # EntityManager/Session viva durante todo el request.
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      # Por encima de easybeach.storage.max-size-bytes: si no, Spring rechaza
      # el upload ANTES de que AssetStorageService llegue a validar nada.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: never # el formato de error propio (RFC 7807) maneja esto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

easybeach:
  jwt:
    # TTLs por rol (etapa 05 §1.1). En minutos / horas.
    access-ttl-minutes-cliente: 60
    access-ttl-minutes-staff: 30
    access-ttl-minutes-super-admin: 15
    refresh-ttl-cliente: P60D
    refresh-ttl-staff: PT12H
    refresh-ttl-super-admin: PT8H
    issuer: easybeach-api
    # private-key-location / public-key-location: sin configurar en local/dev
    # -> se genera un par RSA efímero al arrancar (ver JwtKeyProvider).
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:19006"
  storage:
    # Fuera de src/main/resources a propósito (etapa 05 §6: "fuera del web root").
    root-dir: "./data/assets"
    max-size-bytes: 5242880 # 5 MB
  mercadopago:
    # Credenciales de la aplicación EasyBeach en MP (ADR-004) - vacías acá,
    # obligatorias vía variables de entorno en dev/prod (ver esos perfiles).
    client-id: ""
    client-secret: ""
    redirect-uri: ""
  security:
    # token-encryption-key: sin configurar en local/dev -> se genera una
    # clave AES-256 efímera al arrancar (ver TokenEncryptionService).
    token-encryption-key: ""

logging:
  pattern:
    console: "%d{ISO8601} %-5level [req=%X{requestId}] [bal=%X{balnearioId}] %logger{36} - %msg%n"
