spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

easybeach:
  jwt:
    # Obligatorio en prod: sin estas dos variables el arranque falla (ver
    # JwtKeyProvider) en vez de generar un par efímero como en local/dev.
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
  security:
    # Obligatoria en prod: sin ella, arranca igual pero con clave efímera -
    # los tokens OAuth de MP cifrados antes de un restart quedan indescifrables.
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
  mercadopago:
    client-id: ${MERCADOPAGO_CLIENT_ID}
    client-secret: ${MERCADOPAGO_CLIENT_SECRET}
    redirect-uri: ${MERCADOPAGO_REDIRECT_URI}
  storage:
    root-dir: ${ASSET_STORAGE_ROOT_DIR:/var/easybeach/assets}
  cors:
    # Etapa 20 (hallazgo real): sin este override, prod heredaba el default
    # de application.yml ("http://localhost:3000,http://localhost:19006") -
    # un deploy real habría bloqueado por CORS al propio panel web servido
    # desde el dominio de producción, el mismo tipo de falla crítica que la
    # etapa 17 ya encontró una vez (preflight rechazado antes de llegar al
    # negocio).
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.easybeach: INFO
    org.hibernate: WARN
